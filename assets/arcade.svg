<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs><filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05000d"/><stop offset="1" stop-color="#4a0a4f"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f002"/><stop offset="1" stop-color="#ff2a6d"/></linearGradient>
<clipPath id="bl"><rect y="150" width="1200" height="150"/></clipPath><clipPath id="up"><rect width="1200" height="150"/></clipPath>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".4"/></pattern></defs>
<style>
.t{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace;font-weight:900}
.grid{animation:gr .5s linear infinite} @keyframes gr{to{transform:translateY(7px)}}
.lane{animation:ln .45s linear infinite} @keyframes ln{to{stroke-dashoffset:-40}}
.car{animation:cr 3.2s ease-in-out infinite} @keyframes cr{0%,100%{transform:translateX(0)}25%{transform:translateX(-120px)}60%{transform:translateX(120px)}}
.ob{animation:ob 3s linear infinite;transform-origin:600px 0px}
@keyframes ob{0%{transform:translateY(150px) scale(.05);opacity:0}10%{opacity:1}100%{transform:translateY(300px) scale(1.6);opacity:1}}
.sh{animation:sh 2.4s linear infinite} @keyframes sh{0%{transform:translate(600px,150px) scale(.1)}100%{transform:translate(780px,300px) scale(1.8)}}
.glA{animation:gA 2.4s infinite steps(1)} @keyframes gA{0%,100%{transform:translate(-3px,0)}20%{transform:translate(-9px,2px)}22%{transform:translate(-3px,0)}}
.glB{animation:gB 2s infinite steps(1)} @keyframes gB{0%,100%{transform:translate(3px,0)}50%{transform:translate(10px,-2px)}52%{transform:translate(3px,0)}}
.btn{animation:bt 1.2s ease-in-out infinite} @keyframes bt{50%{opacity:.55}}
.blink{animation:bk 1s infinite steps(1)} @keyframes bk{50%{opacity:0}}
</style>
<rect width="1200" height="300" rx="10" fill="url(#sky)"/>
<g clip-path="url(#up)"><circle cx="600" cy="150" r="90" fill="url(#sun)" filter="url(#g)" opacity=".9"/></g>
<rect y="150" width="1200" height="150" fill="#0a0014"/>
<g clip-path="url(#bl)" stroke="#ff2a6d" stroke-width="1.3" opacity=".8"><g class="grid"><line x1="0" y1="155" x2="1200" y2="155"/><line x1="0" y1="162" x2="1200" y2="162"/><line x1="0" y1="172" x2="1200" y2="172"/><line x1="0" y1="185" x2="1200" y2="185"/><line x1="0" y1="202" x2="1200" y2="202"/><line x1="0" y1="226" x2="1200" y2="226"/><line x1="0" y1="258" x2="1200" y2="258"/><line x1="0" y1="298" x2="1200" y2="298"/></g><line x1="600" y1="150" x2="-1800" y2="300"/><line x1="600" y1="150" x2="-1640" y2="300"/><line x1="600" y1="150" x2="-1480" y2="300"/><line x1="600" y1="150" x2="-1320" y2="300"/><line x1="600" y1="150" x2="-1160" y2="300"/><line x1="600" y1="150" x2="-1000" y2="300"/><line x1="600" y1="150" x2="-840" y2="300"/><line x1="600" y1="150" x2="-680" y2="300"/><line x1="600" y1="150" x2="-520" y2="300"/><line x1="600" y1="150" x2="-360" y2="300"/><line x1="600" y1="150" x2="-200" y2="300"/><line x1="600" y1="150" x2="-40" y2="300"/><line x1="600" y1="150" x2="120" y2="300"/><line x1="600" y1="150" x2="280" y2="300"/><line x1="600" y1="150" x2="440" y2="300"/><line x1="600" y1="150" x2="600" y2="300"/><line x1="600" y1="150" x2="760" y2="300"/><line x1="600" y1="150" x2="920" y2="300"/><line x1="600" y1="150" x2="1080" y2="300"/><line x1="600" y1="150" x2="1240" y2="300"/><line x1="600" y1="150" x2="1400" y2="300"/><line x1="600" y1="150" x2="1560" y2="300"/><line x1="600" y1="150" x2="1720" y2="300"/><line x1="600" y1="150" x2="1880" y2="300"/><line x1="600" y1="150" x2="2040" y2="300"/><line x1="600" y1="150" x2="2200" y2="300"/><line x1="600" y1="150" x2="2360" y2="300"/><line x1="600" y1="150" x2="2520" y2="300"/><line x1="600" y1="150" x2="2680" y2="300"/><line x1="600" y1="150" x2="2840" y2="300"/><line x1="600" y1="150" x2="3000" y2="300"/></g>
<g clip-path="url(#bl)"><polygon points="560,150 640,150 980,300 220,300" fill="#14002a" opacity=".85"/><g stroke="#05d9e8" stroke-width="3" stroke-dasharray="18 22" class="lane"><line x1="587" y1="150" x2="473" y2="300"/><line x1="613" y1="150" x2="727" y2="300"/></g><g class="ob" style="animation-delay:-0s"><rect x="570" y="-5" width="60" height="10" fill="none" stroke="#ff2a6d" stroke-width="3" filter="url(#g)"/></g><g class="ob" style="animation-delay:-1.1s"><rect x="700" y="-5" width="60" height="10" fill="none" stroke="#f9f002" stroke-width="3" filter="url(#g)"/></g><g class="ob" style="animation-delay:-2.0s"><rect x="440" y="-5" width="60" height="10" fill="none" stroke="#b967ff" stroke-width="3" filter="url(#g)"/></g><g class="sh"><polygon points="0,-12 9,0 0,12 -9,0" fill="#05d9e8" filter="url(#g)"/></g></g>
<line x1="0" y1="150" x2="1200" y2="150" stroke="#05d9e8" stroke-width="2" filter="url(#g)"/>
<g class="car" filter="url(#g)">
<polygon points="600,226 640,282 560,282" fill="#0a0014" stroke="#ff2a6d" stroke-width="4"/>
<rect x="566" y="276" width="20" height="8" fill="#f9f002"/><rect x="614" y="276" width="20" height="8" fill="#f9f002"/></g>
<g class="t" font-size="54" letter-spacing="6">
<text x="40" y="78" fill="#05d9e8" opacity=".85" class="glA">NEON RUNNER</text>
<text x="40" y="78" fill="#ff2a6d" opacity=".85" class="glB">NEON RUNNER</text>
<text x="40" y="78" fill="#fff" filter="url(#g)">NEON RUNNER</text></g>
<text x="42" y="108" class="t" font-size="14" letter-spacing="3" fill="#f9f002">DODGE · COLLECT · SURVIVE THE GRID</text>
<g class="btn" filter="url(#g)"><rect x="900" y="40" width="260" height="62" rx="6" fill="#ff2a6d" fill-opacity=".18" stroke="#ff2a6d" stroke-width="3"/>
<text x="1030" y="81" text-anchor="middle" class="t" font-size="26" letter-spacing="4" fill="#fff">▶ PLAY NOW</text></g>
<text x="1030" y="124" text-anchor="middle" class="t" font-size="11" letter-spacing="2" fill="#05d9e8">IN-BROWSER · KEYS OR TOUCH<tspan class="blink" fill="#f9f002"> _</tspan></text>
<rect width="1200" height="300" rx="10" fill="url(#scan)"/>
</svg>