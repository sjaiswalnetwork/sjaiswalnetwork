.dash{stroke-dasharray:80 40;animation:da 4s linear infinite} @keyframes da{to{stroke-dashoffset:-240}}
.blink{animation:bk 1s infinite steps(1)} @keyframes bk{50%{opacity:0}}
.flick{animation:fl 4.5s infinite} @keyframes fl{0%,30%,32%,70%,73%,100%{opacity:1}31%,71%{opacity:.3}}
.gb{opacity:0;animation:gbk steps(1) infinite} @keyframes gbk{0%,86%,100%{opacity:0}87%{opacity:.85;transform:translateX(25px)}90%{opacity:.6;transform:translateX(-30px)}92%{opacity:0}}</style>
