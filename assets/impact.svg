<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="206" viewBox="0 0 1200 206">
<defs><filter id="g" x="-20%" y="-50%" width="140%" height="200%">
<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gs" x="-20%" y="-50%" width="140%" height="200%">
<feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>.m{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace;font-weight:900} .r{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace;font-weight:700}
