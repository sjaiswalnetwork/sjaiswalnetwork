<svg xmlns="http://www.w3.org/2000/svg" width="590" height="220" viewBox="0 0 590 220">
<defs><filter id="g" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".4"/></pattern></defs><style>.t{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace;font-weight:900} .r{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace;font-weight:700}
.glA{animation:gA 2.6s infinite steps(1)} .glB{animation:gB 2.1s infinite steps(1)}
@keyframes gA{0%,100%{transform:translate(-2px,0)}10%{transform:translate(-8px,2px)}12%{transform:translate(3px,-1px)}14%{transform:translate(-2px,0)}60%{transform:translate(-6px,0)}62%{transform:translate(-2px,0)}}
@keyframes gB{0%,100%{transform:translate(2px,0)}30%{transform:translate(9px,-2px)}32%{transform:translate(-3px,1px)}34%{transform:translate(2px,0)}80%{transform:translate(6px,1px)}82%{transform:translate(2px,0)}}
.dash{stroke-dasharray:80 40;animation:da 4s linear infinite} @keyframes da{to{stroke-dashoffset:-240}}
.blink{animation:bk 1s infinite steps(1)} @keyframes bk{50%{opacity:0}}
.flick{animation:fl 4.5s infinite} @keyframes fl{0%,30%,32%,70%,73%,100%{opacity:1}31%,71%{opacity:.3}}
.gb{opacity:0;animation:gbk steps(1) infinite} @keyframes gbk{0%,86%,100%{opacity:0}87%{opacity:.85;transform:translateX(25px)}90%{opacity:.6;transform:translateX(-30px)}92%{opacity:0}}</style>
