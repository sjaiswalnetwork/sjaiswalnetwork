<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64">
<defs><filter id="g" x="-20%" y="-50%" width="140%" height="200%">
<feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#ff2a6d"/><stop offset=".6" stop-color="#f9f002"/><stop offset="1" stop-color="#f9f002" stop-opacity="0"/></linearGradient></defs>
<style>.m{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace;font-weight:900}
.bar{animation:b 2.8s cubic-bezier(.7,0,.3,1) infinite alternate;transform-origin:0 0} @keyframes b{from{transform:scaleX(.25)}to{transform:scaleX(1)}}
.dot{animation:d 1.2s infinite steps(1)} @keyframes d{50%{opacity:.1}}
.run{animation:r 2.2s linear infinite} @keyframes r{from{transform:translateX(0)}to{transform:translateX(1100px)}}
</style>
