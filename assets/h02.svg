<text x="104" y="40" class="m" font-size="28" letter-spacing="5" fill="#fff" filter="url(#g)">IMPACT.LOG</text>
<rect class="bar" x="104" y="52" width="1080" height="3" fill="url(#l)" filter="url(#g)"/>
