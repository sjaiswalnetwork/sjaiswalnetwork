name: profile-sync

# Redraws the Experience picture whenever you
#   1) edit data/experience.yml, or
#   2) upload a LinkedIn Positions.csv (or Positions-only .zip) into the linkedin/ folder.
# No AI involved: a small Python script reads the file and draws the SVG.
on:
  push:
    branches: [main]
    paths:
      - "data/experience.yml"
      - "linkedin/**"
      - "scripts/experience.py"
      - "data/credentials.yml"
      - "scripts/credentials.py"
      - "scripts/linkedin_extra.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experience
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - name: Import LinkedIn file if one was uploaded
        run: |
          shopt -s nullglob nocaseglob
          files=(linkedin/*.csv linkedin/*.zip)
          for f in "${files[@]}"; do
            if [[ "$f" == *.zip ]] && unzip -l "$f" | grep -qiE "messages\.csv|connections\.csv|email addresses\.csv|phonenumbers\.csv"; then
              echo "::error::This is LinkedIn's FULL archive (it has messages/contacts). Not imported. Upload only the small files listed in UPDATE-GUIDE.md."
              continue
            fi
            echo "Importing $f"
            python scripts/linkedin_extra.py "$f"
            python scripts/experience.py --import "$f"
            python scripts/credentials.py --import "$f"
          done
          if [ ${#files[@]} -gt 0 ]; then
            git rm -q --cached "${files[@]}" || true
            rm -f "${files[@]}"
          fi
          python scripts/experience.py
          python scripts/credentials.py
      - name: Save
        run: |
          git config user.name "neon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data assets/experience.svg assets/credentials.svg linkedin
          git diff --cached --quiet && exit 0
          git commit -m "experience: redraw timeline [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 3; done
