name: cyber-refresh

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cyber-refresh.yml"
      - "scripts/now.py"

permissions:
  contents: write

concurrency:
  group: cyber-refresh
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate neon contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?color_snake=#ff2a6d&color_dots=#14022a,#2b0a5c,#b967ff,#05d9e8,#f9f002&color_background=#0a0014
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  now-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build live terminal panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/now.py assets/now.svg
      - name: Commit if changed
        run: |
          git config user.name "neon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/now.svg
          git diff --cached --quiet || (git commit -m "chore: refresh live panel [skip ci]" && git push)
