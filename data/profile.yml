case_studies:
  - icon: "🎧"
    tag: "AI · Speech-to-text · LLM audit"
    title: "AI call-audit pipeline"
    result_big: "6–7 hrs → under 2 hrs"
    problem: "About 900 sales and CRM calls a day. Reviewing the recordings by hand took 6–7 hours every day."
    solution: "A scheduled pipeline: call recordings from the CRM → Hindi/English speech-to-text → Claude scores every call against a fixed audit checklist → results land in team-wise Google Sheets."
    result: "Review time cut from 6–7 hours to under 2, with audit results organised per team and per rep."
    stack: "Runo CRM · Sarvam AI · Claude · Google Sheets · scheduled tasks"
  - icon: "🔎"
    tag: "Process fix · Offline tool"
    title: "Regulatory lookup finder"
    result_big: "15 min → 10 s"
    problem: "Staff matched product compositions by hand against 3 long approval documents (2,856 entries) — 10–15 minutes per lookup, with spelling and unit mismatches."
    solution: "Treated it as a process problem first. Built a single-file offline finder with AI: paste a composition and get the form, entry number, table location and a link to the scanned approval page. Deterministic, exact matches only, all 2,856 entries tested on every build."
    result: "~98% faster lookups, 4–5 staff-hours saved per day, ₹0 running cost, handed over to a non-technical user."
    stack: "Claude (build time only) · HTML/JS · Google Drive sync"
  - icon: "💬"
    tag: "ERP integration · API"
    title: "ERP → WhatsApp order updates"
    result_big: "13 auto-updates"
    problem: "Customers had to call to ask \"where's my order?\", and the team re-typed data between two ERPs every day."
    solution: "Connected the ERP to the WhatsApp Business API with 13 approved templates that fire automatically from order acceptance to dispatch, with live product, MRP and delivery date. Added a live ERP-to-ERP transfer-slip sync."
    result: "Customers updated at every stage without a call, and 80–90 manual entries a day eliminated."
    stack: "Finaman ERP · Interakt WhatsApp API · CSV export · Google Apps Script"

